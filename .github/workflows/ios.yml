name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Kotlin/Native iOS compilation and simulator tests only run on macOS -- see PLAN.md phase 5,
    # step 40 (this sandbox has no macOS/Xcode, so this workflow was never actually run here;
    # it's written from the same task names verified to exist via `./gradlew tasks --all`).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build iOS frameworks (device + simulator)
        run: |
          ./gradlew \
            :shared:linkDebugFrameworkIosArm64 \
            :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run Kotlin/Native tests on the iOS simulator
        run: |
          ./gradlew \
            :shared:iosSimulatorArm64Test \
            :shared:domain:iosSimulatorArm64Test \
            :shared:data:iosSimulatorArm64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: '**/build/test-results/iosSimulatorArm64Test/'
          retention-days: 14
