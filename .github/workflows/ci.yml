name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      # iOS targets are skipped automatically on Linux (Kotlin/Native simulator tests need
      # macOS) -- see .github/workflows/ios.yml for that coverage.
      - name: Unit tests (JVM + Android host tests, all modules)
        run: ./gradlew allTests

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Coverage report
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 14

      # Computes overall line coverage from Kover's merged JaCoCo-format XML (the last <counter
      # type="LINE"> in the file is the report-level total, after all per-package ones) and
      # writes it as a shields.io "endpoint" JSON badge -- self-hosted, no external coverage
      # service or account needed. README.md points its badge at this file via the shields.io
      # /endpoint URL.
      - name: Generate coverage badge
        if: github.event_name == 'push'
        run: |
          mkdir -p .github/badges
          read -r missed covered <<< "$(grep -oE '<counter type="LINE" missed="[0-9]+" covered="[0-9]+"/>' build/reports/kover/report.xml \
            | tail -1 \
            | grep -oE '[0-9]+' \
            | tr '\n' ' ')"
          total=$((missed + covered))
          pct=$((covered * 100 / total))
          color=red
          if [ "$pct" -ge 80 ]; then color=brightgreen
          elif [ "$pct" -ge 60 ]; then color=yellow
          fi
          cat > .github/badges/coverage.json <<EOF
          {"schemaVersion":1,"label":"coverage","message":"${pct}%","color":"${color}"}
          EOF

      - name: Commit coverage badge
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: update coverage badge'
          file_pattern: .github/badges/coverage.json
